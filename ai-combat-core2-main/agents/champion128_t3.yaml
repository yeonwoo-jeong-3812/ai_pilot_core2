# 128승 조종사 — 함수-구간 3층 BT (생성: research/gen_champion_yaml.py)
# 문장 출처: research/data/blueteam/induced_rules_t3full_verified.json (14문장). 손편집 금지 — 재생성할 것.
# 표시 상수는 로드 시점에 정본 값과 일치가 단언된다(드리프트 검출).
agent_name: Champion128
dwell_s: 0                       # 문장·기저가 자체 래치 보유
custom_module: champion128/ledger_nodes.py
selector:
  # ①층 — 상황 함수 계산(20Hz 부기·10Hz 결정) + 기저 선계산
  #   함수 사전(ledger_book 이 매 결정틱 계산; ②층 문장의 좌표계):
  #     rng      두 기체 거리 [ft]
  #     ata      내 기수-조준각 [deg] (0=정조준)
  #     eata     적 기수-조준각 [deg] (0=적이 나를 정조준)
  #     race     조준 경쟁 = eata − ata [deg] (+ = 경쟁 우위)
  #     kcas     내 속도 [kt]
  #     alt      내 고도 [ft]
  #     agap     고도차 = 내 − 적 [ft]
  #     hp_lead  장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  #     clos     접근율 [kt] (+ = 가까워지는 중)
  #     pursue   적 추격 점유율(무장 후 12s 창) [0~1]
  #     hotrun   적 hot(eata<45°) 연속 지속 [s]
  #     eclimb   적 상승률 [fps] (− = 강하)
  #     dalt     내 고도변화율 [fps]
  #     es_rel   비에너지 차 = (h+v²/2g) 내 − 적 [ft]
  #     t        경과 시간 [s]
  #     fdmg     내가 가한 데미지(장부) [hp]
  #   기저는 트리가 아니라 명시 함수 2개(f_gun/f_lead — 루프32 재유도)
  - custom: {name: ledger_book, refuse: auto, base_fn: gun20}
  # ②층 — 함수-구간 문장 (위가 선순위; 발화 1회·dur 유지)
  #   구간은 발화-구속 축만 남긴 것(축 다이어트 — 전 발화 스케줄 불변 증명,
  #   research/slim_rules.py). 문장 = 함수값 구간의 교집합 국면 → 국소 풀이.
  - custom:                    # 문장#0 — 피복: E1_AdaptiveAce/red  타이밍여유 8~8s
      name: sentence
      label: s0_break
      act: break
      dur: 6.0
      box:
        rng: [5781.8, 6481.8]        # 두 기체 거리 [ft]
        dalt: [541.1799, 721.18]     # 내 고도변화율 [fps]
        eclimb: [361.81, 436.81]     # 적 상승률 [fps] (− = 강하)
        clos: [-530.6701, -468.67]   # 접근율 [kt] (+ = 가까워지는 중)
  - custom:                    # 문장#1 — 피복: C1_TwoCircleRate/red,C1_TwoCircleRate/red,C1_TwoCircleRate/red…  타이밍여유 12~12s
      name: sentence
      label: s1_climb
      act: climb
      dur: 6.0
      box:
        rng: [6924.58, 7604.58]     # 두 기체 거리 [ft]
        eclimb: [364.06, 463.06]    # 적 상승률 [fps] (− = 강하)
        clos: [-257.66, -239.66]    # 접근율 [kt] (+ = 가까워지는 중)
        pursue: [-0.1301, 0.1701]   # 적 추격 점유율(무장 후 12s 창) [0~1]
  - custom:                    # 문장#2 — 피복: D3_Scissors/red,D3_Scissors/red,D3_Scissors/red  타이밍여유 6~36s
      name: sentence
      label: s2_break
      act: break
      dur: 6.0
      box:
        rng: [398.46, 1138.46]      # 두 기체 거리 [ft]
        eclimb: [-170.58, -71.58]   # 적 상승률 [fps] (− = 강하)
        hp_lead: [5.54, 11.54]      # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
        pursue: [-0.1501, 0.1501]   # 적 추격 점유율(무장 후 12s 창) [0~1]
  - custom:                    # 문장#3 — 피복: official/blue,official/red  타이밍여유 8~8s
      name: sentence
      label: s3_break
      act: break
      dur: 6.0
      box:
        rng: [7048.34, 7748.52]      # 두 기체 거리 [ft]
        eclimb: [-739.59, -559.57]   # 적 상승률 [fps] (− = 강하)
        clos: [-584.76, -516.73]     # 접근율 [kt] (+ = 가까워지는 중)
  - custom:                    # 문장#4 — 피복: E2_Passive/blue,E2_Passive/red,E2_Passive/blue…  타이밍여유 8~8s
      name: sentence
      label: s4_climb
      act: climb
      dur: 6.0
      box:
        eclimb: [-134.6101, 46.08]   # 적 상승률 [fps] (− = 강하)
        clos: [-532.13, -411.5299]   # 접근율 [kt] (+ = 가까워지는 중)
        hp_lead: [-1.4401, 4.67]     # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  - custom:                    # 문장#5 — 피복: E1_AdaptiveAce/blue,official/blue,official/red  타이밍여유 4~4s
      name: sentence
      label: s5_e_extend
      act: e_extend
      dur: 6.0
      box:
        rng: [398.61, 2104.7]      # 두 기체 거리 [ft]
        dalt: [-37.63, 269.17]     # 내 고도변화율 [fps]
        eclimb: [270.69, 396.27]   # 적 상승률 [fps] (− = 강하)
        eata: [147.8, 165.32]      # 적 기수-조준각 [deg] (0=적이 나를 정조준)
        hp_lead: [0.7499, 13.21]   # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  - custom:                    # 문장#6 — 피복: B1_EnergyFighter/red,B1_EnergyFighter/red,B1_EnergyFighter/red…  타이밍여유 12~12s
      name: sentence
      label: s6_lag
      act: lag
      dur: 6.0
      box:
        rng: [4575.18, 5050.4]   # 두 기체 거리 [ft]
        dalt: [224.03, 292.53]   # 내 고도변화율 [fps]
        ata: [7.2199, 30.61]     # 내 기수-조준각 [deg] (0=정조준)
        hotrun: [0.3999, 3.45]   # 적 hot(eata<45°) 연속 지속 [s]
  - custom:                    # 문장#7 — 피복: redteam/blue  타이밍여유 8~8s
      name: sentence
      label: s7_unload
      act: unload
      dur: 6.0
      box:
        rng: [1664.85, 2564.85]    # 두 기체 거리 [ft]
        fdmg: [41.4999, 53.5001]   # 내가 가한 데미지(장부) [hp]
        hp_lead: [9.91, 13.21]     # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  - custom:                    # 문장#8 — 피복: E1_AdaptiveAce/blue,E1_AdaptiveAce/red,E1_AdaptiveAce/blue…  타이밍여유 4~8s
      name: sentence
      label: s8_break
      act: break
      dur: 6.0
      box:
        rng: [5753.22, 6026.78]    # 두 기체 거리 [ft]
        es_rel: [292.44, 448.33]   # 비에너지 차 = (h+v²/2g) 내 − 적 [ft]
        clos: [-485.17, -384.27]   # 접근율 [kt] (+ = 가까워지는 중)
        hp_lead: [2.42, 10.29]     # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  - custom:                    # 문장#9 — 피복: B1_EnergyFighter/red,B1_EnergyFighter/red,C3_Lufbery/red…  타이밍여유 8~8s
      name: sentence
      label: s9_climb
      act: climb
      dur: 6.0
      box:
        rng: [5999.27, 6699.2701]   # 두 기체 거리 [ft]
        eclimb: [348.54, 528.54]    # 적 상승률 [fps] (− = 강하)
        clos: [-577.08, -513.08]    # 접근율 [kt] (+ = 가까워지는 중)
        hp_lead: [5.54, 11.54]      # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  - custom:                    # 문장#10 — 피복: E1_AdaptiveAce/blue  타이밍여유 8~8s
      name: sentence
      label: s10_gun_pure
      act: gun_pure
      dur: 6.0
      box:
        rng: [5699.96, 6279.96]                               # 두 기체 거리 [ft]
        ata: [94.98, 124.98]                                  # 내 기수-조준각 [deg] (0=정조준)
        eata: [93.91, 123.91]                                 # 적 기수-조준각 [deg] (0=적이 나를 정조준)
        agap: [-1439.1, 1560.9]                               # 고도차 = 내 − 적 [ft]
        hp_lead: [2.4200000000000035, 8.41999999999999]       # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
        clos: [-514.8399999999999, -444.84]                   # 접근율 [kt] (+ = 가까워지는 중)
        pursue: [-0.10000000000000007, 0.20000000000000012]   # 적 추격 점유율(무장 후 12s 창) [0~1]
        hotrun: [-1.5000000000000007, 1.5000000000000007]     # 적 hot(eata<45°) 연속 지속 [s]
        eclimb: [452.68, 575.6800000000001]                   # 적 상승률 [fps] (− = 강하)
        dalt: [524.02, 680.02]                                # 내 고도변화율 [fps]
        es_rel: [-1242.99, 1757.01]                           # 비에너지 차 = (h+v²/2g) 내 − 적 [ft]
        race: [-22.059999999999988, 19.93999999999999]        # 조준 경쟁 = eata − ata [deg] (+ = 경쟁 우위)
  - custom:                    # 문장#11 — 피복: C1_TwoCircleRate/red,C1_TwoCircleRate/red,C1_TwoCircleRate/red…  타이밍여유 12~12s
      name: sentence
      label: s11_gun_pure
      act: gun_pure
      dur: 6.0
      box:
        rng: [6924.58, 7604.58]     # 두 기체 거리 [ft]
        eclimb: [364.06, 463.06]    # 적 상승률 [fps] (− = 강하)
        clos: [-257.66, -239.66]    # 접근율 [kt] (+ = 가까워지는 중)
        pursue: [-0.1301, 0.1701]   # 적 추격 점유율(무장 후 12s 창) [0~1]
  - custom:                    # 문장#12 — 피복: D1_Reactive/red,E1_AdaptiveAce/blue  타이밍여유 24~30s
      name: sentence
      label: s12_lag
      act: lag
      dur: 6.0
      box:
        rng: [855.2, 7881.49]       # 두 기체 거리 [ft]
        dalt: [81.85, 645.84]       # 내 고도변화율 [fps]
        eclimb: [71.59, 237.62]     # 적 상승률 [fps] (− = 강하)
        race: [-24.79, -1.94]       # 조준 경쟁 = eata − ata [deg] (+ = 경쟁 우위)
        pursue: [-0.1501, 0.1701]   # 적 추격 점유율(무장 후 12s 창) [0~1]
  - custom:                    # 문장#13 — 피복: redteam/red  타이밍여유 4~4s
      name: sentence
      label: s13_lag
      act: lag
      dur: 6.0
      box:
        rng: [1664.82, 2564.82]      # 두 기체 거리 [ft]
        clos: [-985.23, -865.23]     # 접근율 [kt] (+ = 가까워지는 중)
        eclimb: [179.5299, 293.53]   # 적 상승률 [fps] (− = 강하)
        hp_lead: [6.9, 10.2]         # 장부 점수차 = 내HP − 적HP(부기 추정) [hp]
  # ③층 — 구간 밖 일반해(기저 판독 가지; 위가 선순위 = 원본 dispatch 순서)
  - custom:                    # 점수-장부 게이트 거부(효능 폐루프)
      name: base_branch
      when: refuse
      label: gate_refuse
      gate_hot: 45.0
      gate_rng: 4500.0
      gate_edge: 12.0
      lead_near: 1.0
      lead_hi: 8.0
      lead_floor: 8.0
      hurt_max: 4.0
      cooldown_s: 15.0
      abort_off: 2
      clear_hot: 60.0
      clear_rng: 6000.0
      pursue_win_s: 12.0
      pursue_max: 0.6
      pursue_min_s: 3.0
      dom: 25.0
      threat_hold_s: 1.2
  - custom: {name: base_branch, when: empty_dive, label: empty_dive_response}
  - custom:
      name: base_branch
      when: hard_deck
      label: hard_deck_climb
      hard_deck: 1300.0
  - custom:                    # 적 다이브-커밋 감지(c≥θ) → off 대응(수치 argmax)
      name: base_branch
      when: dive_response
      label: dive_commit_response
      theta: 0.4
      decay: 0.999
      dive_fps: 80.0
      dive_hold: 1.5
      aa_extend: 50.0
  - custom:
      name: base_branch
      when: deck_suppress
      label: headon_deck_suppress
      suppress_alt: 4500.0
      suppress_rng: 7000.0
  - custom:                    # 기저함수 f_gun — 조준 원뿔 안이면 건 추적
      name: base_branch
      when: f_gun
      label: f_gun
      gun_ata: 20.0            # ata < 이 값 → GUN_TRACK
  - custom: {name: base_branch, when: f_lead, label: f_lead}   # 그 외 → LEAD_TURN
  - custom: {name: base_pilot}   # 안전망(비활성 경로 preserve/deck_guard)
