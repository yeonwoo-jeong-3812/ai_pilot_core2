# Red Team 대항군 — ALLROUND (균형형 / held-out 후보). 비배포.
#
# pure 조준의 강함 + 피격 방지(방어) + 사격 최적화(건 조준·후방 압박). 복잡한
# 요요·lag 분기는 배제 — 조준을 놓쳐 역효과였다(리그 실측). 시나리오 편중이
# 가장 적어 held-out 재평가(D9)의 기준 대항군으로 적합.
selector:
  - sequence:
      - condition: {name: low_altitude, floor_ft: 4500}
      - action: {pursuit: pure, aim_above_ft: 4000, name: recover_altitude}
  # 방어: 조준당함 + 근접 → 브레이크 (피격 방지)
  - sequence:
      - condition: {name: foe_threat, aspect_deg: 150}
      - condition: {name: merged, range_ft: 6000}
      - action: {pursuit: lag, max_g: true, name: break_defense}
  # 건 사거리 + 조준각 → 정밀 추적 사격
  - sequence:
      - condition: {name: in_gun_envelope, range_ft: 3000, ata_deg: 35}
      - action: {pursuit: pure, name: gun_track}
  # 후방 반구 → pure 압박 (조준 유지)
  - sequence:
      - condition: {name: behind_foe, aspect_deg: 70}
      - action: {pursuit: pure, name: press_attack}
  - action: {pursuit: pure, name: pure_default}
