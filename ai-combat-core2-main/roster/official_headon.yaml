# 아키타입: Textbook Headon — 교본형(안정·설명가능성 우선). stable/control_zone 모드 시연.
#
# 성향: 헤드온에서 배면·롤 없이 날개 수평으로 ATA→0(mode: stable, 포인팅 추적),
# 공세를 잡으면 control zone 을 유지(mode: control_zone)하다 attack cue 에 사격.
# 공격성(최대 데미지)보다 매끄러움·교리 충실을 우선 — 순수 공격형(attacker)과 대비되는 스파링 상대.
#
# 우선순위(selector, 위가 먼저):
#   하드덱 회피 > 헤드온 안정(HABFM) > 방어(DBFM) > control zone 유지(OBFM) > 건 조준 > 기본 pure
#
# 사용: python scripts/run_match.py --scenario headon --blue examples/textbook_headon.yaml --red examples/attacker.yaml
agent_name: TextbookHeadon
selector:
  # 0) 하드덱 회피 — 최우선(하드덱 1,000ft 위반 = 즉시 패)
  - sequence:
      - condition: {name: low_altitude, floor_ft: 4500}
      - action: {pursuit: pure, aim_above_ft: 4000, name: recover_altitude}
  # 1) 헤드온 안정 노즈온(HABFM) — 핵심 시연. 대향(hca>150)에서 mode: stable 이
  #    수평 우선 뱅크 + 부호있는 pitch 로 배면·롤 없이 ATA→0. Tacview 에서 GMode=stable_track,
  #    L2 유도의 dφ 가 작게 유지되는 것을 육안 확인.
  - sequence:
      - condition: {name: is_head_on, hca_deg: 150}
      - action: {pursuit: pure, mode: stable, name: headon_stable}
  # 2) 방어(DBFM): 적이 내 후미 조준 + 근접 → 브레이크
  - sequence:
      - condition: {name: is_defensive, aspect_deg: 150}
      - condition: {name: merged, range_ft: 6000}
      - action: {pursuit: lag, max_g: true, name: break_defense}
  # 3) 공세(OBFM): 후방 반구 점유 → control zone 유지(접근율 조절·오버슈트 억제)
  - sequence:
      - condition: {name: is_offensive, aspect_deg: 45}
      - action: {pursuit: lag, mode: control_zone, name: hold_control_zone, lag_dist_ft: 900}
  # 4) attack cue: 건 사거리 + 조준각 + 과속접근 아님 → 사격
  - sequence:
      - condition: {name: in_gun_envelope, range_ft: 3000, ata_deg: 30}
      - inverter: {condition: {name: closing, min_fps: 250}}
      - action: {pursuit: pure, name: gun_track}
  # 5) 기본: pure
  - action: {pursuit: pure, name: pure_default}
