# core-live zoo 상대 'ace' (archetype ) 를 core2 어휘로 자동번역.
# 원본: core-live/src/engine/opponents/zoo/ace.yaml
# 번역기: translate_zoo.py (일회성 구 도구 — 정리로 삭제, git 이력 보존. 의미론 ground truth=yaml_bt.py).
# ⚠ 아키타입 행동 등가 이식(틱-동일 아님) — core2 물리로 재계측 대상.
# 근사 노드:
#   - APPROX: IsNeutralSituation→is_head_on(HCA>150)
agent_name: ace
selector:
- sequence:
  - condition:
      name: low_altitude
      floor_ft: 1000.0
  - action:
      pursuit: pure
      aim_above_ft: 4000.0
      name: climb
- sequence:
  - condition:
      name: merged
      range_ft: 3000
  - inverter:
      condition:
        name: merged
        range_ft: 500
  - condition:
      name: in_gun_envelope
      range_ft: 60000.0
      ata_deg: 15
  - action:
      pursuit: pure
      name: gun_track
- sequence:
  - condition: is_defensive
  - selector:
    - sequence:
      - condition:
          name: is_defensive
          aspect_deg: 130.0
      - action:
          pursuit: lag
          max_g: true
          name: break
    - sequence:
      - condition:
          name: is_defensive
          aspect_deg: 100.0
      - action:
          pursuit: lag
          max_g: true
          name: break
    - sequence:
      - condition:
          name: low_altitude
          floor_ft: 16404
      - action:
          pursuit: lead
          max_g: true
          aim_above_ft: 2000.0
          name: high_yoyo
    - action:
        pursuit: lead
        max_g: true
        aim_above_ft: 2000.0
        name: high_yoyo
- sequence:
  - condition: is_offensive
  - selector:
    - sequence:
      - condition:
          name: merged
          range_ft: 4921
      - action:
          pursuit: lead
          name: lead
    - sequence:
      - condition:
          name: merged
          range_ft: 9843
      - condition:
          name: nose_far
          ata_deg: 30
      - action:
          pursuit: lead
          max_g: true
          name: one_circle
    - sequence:
      - condition:
          name: merged
          range_ft: 13123
      - action:
          pursuit: lag
          name: lag
    - action:
        pursuit: pure
        name: pursue
- sequence:
  - condition: is_head_on
  - selector:
    - sequence:
      - condition:
          name: low_altitude
          floor_ft: 11483
      - action:
          pursuit: lead
          max_g: true
          aim_above_ft: 2000.0
          name: high_yoyo
    - sequence:
      - condition:
          name: nose_far
          ata_deg: 60
      - action:
          pursuit: lead
          max_g: true
          aim_above_ft: 2000.0
          name: high_yoyo
    - sequence:
      - condition:
          name: merged
          range_ft: 8202
      - action:
          pursuit: lead
          max_g: true
          name: one_circle
    - action:
        pursuit: lead
        name: lead
- action:
    pursuit: pure
    name: pursue

