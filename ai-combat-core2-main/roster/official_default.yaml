# L1 전술 트리 (기본) — aircombat/tactics/dsl.py DEFAULT_SPEC 미러.
# 우선순위 selector: 방어 > 오버슈트회피 > 연장추격 > 건조준 > 기수당김 > 기본.
# 조건 이름은 aircombat/tactics/conditions.py 의 CONDITIONS 참조.
selector:
  - sequence:
      - condition: foe_threat
      - action: {pursuit: lag,  max_g: true,  name: break_defense}
  - sequence:
      - condition: overshoot_risk
      - action: {pursuit: lag,  max_g: false, name: lag_reposition}
  - sequence:
      - condition: foe_extending
      - action: {pursuit: lead, max_g: true,  name: lead_rundown}
  - sequence:
      - condition: in_gun_envelope
      - action: {pursuit: pure, max_g: false, name: gun_track}
  - sequence:
      - condition: nose_far
      - action: {pursuit: lead, max_g: false, name: lead_pull}
  - action: {pursuit: pure, max_g: false, name: pure_default}
