# 개방 기능 시연 A — 교리형(Doctrine Regulator). **doctrine 블록 사용례.**
#
# 목적: 교리 setpoint 튜닝만으로 어디까지 되는지 보여준다.
#   · doctrine 블록 (L2 setpoint 튜닝, 2026-08-24 기준 19필드 개방)
#   · 신규 조건 3종 (low_health / vel_nose_far / foe_path_threat)
#   · fighting band ↔ L1 조건 기본 임계 연동 (kcas 미지정 시 교리값 추종)
#
# ⚠ **파라미터는 의도적으로 최적이 아니다.** 아래 4필드는 개방 대역의 "쓸 수는 있지만
#   좋지는 않은" 쪽 끝에 두었다 — 무엇이 어떻게 나빠지는지 직접 재보라는 뜻이다.
#   교리는 **에이전트 전역**이라 한 필드를 바꾸면 모든 분기가 함께 움직인다.
#   국면별로 다르게 하고 싶으면 액션 파라미터(g_burst/g_full_ata_deg/track_*)를 쓸 것.
#
# doctrine 값 근거 (scripts/sweep_doctrine.py 1,368경기, 2026-08-17):
#   g_min: 1.5        조절형 base 최선(+3). ATA 비례 백오프의 하한을 올려 조준 근접
#                     구간에서 1G 로 주저앉는 것을 막는다 — max_g 없이 추적을
#                     유지하려면 이 하한이 실질 방어선이다.
#   energy_margin_lo: 75  (+3, 대역 [75,75]로 점 축소). 스윕은 one-at-a-time 이라
#                     lo=75·hi=50 을 합치면 lo>hi 로 거부된다 — 실측 config 그대로
#                     lo 만 올린다(hi 는 기본 75 유지).
#   lv_above_ft: 500  조절형 base 최선(+6). 리프트벡터를 적 POM 살짝 위로만 둬
#                     수직 과소산을 억제(1000 은 −12 로 최악이었다).
#   건드리지 않은 것: fighting_kts_lo (375 로 올리면 −12, 상시 에너지 회복 모드에
#                     갇힌다) · slant_ft_hi (4,000 으로 좁히면 무교전 급증).
#   initial_pull_aspect_deg: 140  머지 진입 판정을 좁혔다 — 비스듬한 머지에서 초기
#                     당김·LV 자동 오프셋을 놓친다.
#   closure_saddle_ft: 1200  접근율 깔때기의 새들이 멀다 — 붙는 속도가 느려 사격 기회가
#                     늦게 온다(존 유지엔 안전).
#   energy_backoff_floor: 0.4  저속 감쇠 바닥이 낮다 — 파이팅 하한 아래에서 G 가 40%
#                     까지 주저앉아 그 사이 각을 내준다.
#   cz_close_t_s: 6.0  control_zone 수렴이 굼뜨다 — 오버슈트는 적으나 존 진입이 느리다.
#
#   ⚠ 이 값들을 더 극단으로 밀면 **교전 자체가 성립하지 않는다**(실측: 초기 설정에서
#     무접촉 15/40 = 쌍방 패). 무접촉은 무승부가 아니라 양측 0점이다.
doctrine:
  g_min: 1.5
  energy_margin_lo: 75.0
  lv_above_ft: 500.0
  initial_pull_aspect_deg: 140.0
  closure_saddle_ft: 1200.0
  energy_backoff_floor: 0.4
  cz_close_t_s: 6.0

agent_name: DoctrineRegulator

selector:
  # 0) 하드덱 회피 — 최우선. 이 분기만 g_burst 를 올린다(하드덱 위반 = 즉시 패이고,
  #    실측에서 조절만으로 하는 회복은 3.68G 로 하드덱을 뚫었다). 예측 발동으로
  #    강하 관성까지 감안한다. 조준점이 4,000ft 위라 비례 조절이 알아서 세게 당긴다.
  - sequence:
      - condition: {name: low_altitude, floor_ft: 4500, lookahead_s: 3.5}
      - action: {pursuit: pure, g_burst: 0.8, aim_above_ft: 4000, name: recover_altitude}

  # 1) 손상 국면 (신규 low_health) — 적 HP 는 비노출이라 "지고 있는지"는 알 수 없다.
  #    그래도 내 HP 가 낮으면 정면 교환은 산술적으로 불리하다(같은 DPS 면 내가 먼저 0).
  #    적 경로가 나를 향할 때만 lag 로 각을 빼 결착을 늦춘다.
  - sequence:
      - condition: {name: low_health, hp: 35}
      - condition: {name: foe_path_threat, vel_aa_deg: 110}
      - action: {pursuit: lag, lag_dist_ft: 3500, aim_above_ft: -200, name: wounded_disengage}

  # 2) 건 솔루션 — 조절 경로의 추적 G(track_lock)에 의존한다. v2.9.0 에서 aspect<90
  #    게이트가 제거되어 이 분기가 실제로 조준을 유지한다(구 엔진에선 1~3G 로 흘렀다).
  - sequence:
      - condition: {name: in_gun_envelope, range_ft: 3000, ata_deg: 25}
      - action: {pursuit: pure, name: gun_track}

  # 3) 경로 이탈 감지 (신규 vel_nose_far) — 기수는 표적을 물었는데 속도벡터가 흘러나가는
  #    상태. 기수 기준 nose_far 로는 안 잡힌다(ata 는 작으니까). 궤적 자체를 리드로 당긴다.
  - sequence:
      - condition: {name: vel_nose_far, vel_ata_deg: 55}
      - condition: {name: closing, min_fps: -50}
      - action: {pursuit: lead, lead_time_s: 1.0, name: path_realign}

  # 4) 경로 기반 방어 (신규 foe_path_threat) — 적 기수(aspect)가 아니라 적 비행경로가
  #    나를 향하는 국면. 기수는 흔들려도 경로는 못 숨긴다 → 더 이른 방어 트리거.
  - sequence:
      - condition: {name: foe_path_threat, vel_aa_deg: 130}
      - condition: {name: merged, range_ft: 5000}
      - action: {pursuit: lag, aim_above_ft: 250, name: path_break}

  # 5) 에너지 회복 — kcas 미지정 = 교리 fighting_kts_lo(325) 추종(v2.9.0 연동).
  #    cooldown 으로 임계 근처 chattering 차단.
  - cooldown:
      name: energy_recover
      wait_s: 4.0
      child:
        sequence:
          - condition: below_fighting_speed
          # 거리 게이트 — 이미 멀어졌으면 더 빼지 않는다. 없으면 저속 판정이 계속
          # 참인 동안 영원히 이격해 무접촉(쌍방 패)으로 끝난다.
          - condition: {name: merged, range_ft: 8000}
          - action: {pursuit: lag, lag_dist_ft: 4000, aim_above_ft: -350, name: energy_recover}

  # 6) 에너지 우위 + 후방 점유 → 압박. energy_margin 축소로 이 조건이 더 자주 참이 된다.
  - sequence:
      - condition: {name: energy_advantage, min_ft: 300}
      - condition: behind_foe
      - action: {pursuit: lead, lead_time_s: 1.1, name: press_offense}

  # 7) 컨트롤존 유지 — 오버슈트 대신 존 체류(파워로 접근율 조절).
  - sequence:
      - condition: in_control_zone
      - action: {pursuit: lag, mode: control_zone, lag_dist_ft: 2500, name: hold_cz}

  # 8) 기수 회복 — 패스 직후 각 벌어짐. 조절 경로라 max_g 없이 당긴다.
  - sequence:
      - condition: {name: nose_far, ata_deg: 60}
      - action: {pursuit: lead, lead_time_s: 1.0, name: regain_nose}

  # 9) 기본 — pure 접근
  - action: {pursuit: pure, name: pure_default}
